<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Serata Attempatoni</title>
  <meta name="description" content="Trova il gioco cross-play PC/Xbox giusto per il vostro gruppo e organizza la serata settimanale.">
  <meta name="theme-color" content="#2f7d4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Attempatoni">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true">🎮</span>
    <h1 id="group-title">Serata Attempatoni</h1>
  </header>

  <main id="view"></main>

  <nav class="tabs" aria-label="Sezioni">
    <button data-tab="gruppo"><span>👥</span>Gruppo</button>
    <button data-tab="vota"><span>🗳️</span>Vota</button>
    <button data-tab="consigli"><span>🏆</span>Classifica</button>
    <button data-tab="serata"><span>📅</span>Serata</button>
    <button data-tab="altro"><span>⚙️</span>Altro</button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/games.js"></script>
  <script src="data/steam-data.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
