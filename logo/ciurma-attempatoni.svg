<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sea" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#2a8a96"/>
      <stop offset="1" stop-color="#0c3a47"/>
    </radialGradient>
    <clipPath id="inner"><circle cx="512" cy="512" r="372"/></clipPath>
    <path id="arcTop" d="M 117 512 A 395 395 0 0 1 907 512"/>
    <path id="arcBottom" d="M 92 512 A 420 420 0 0 0 932 512"/>
  </defs>

  <!-- fondo pieno: WhatsApp ritaglia l'immagine in un cerchio -->
  <rect width="1024" height="1024" fill="#0b1f2a"/>

  <!-- anello esterno con le scritte -->
  <circle cx="512" cy="512" r="470" fill="#0b1f2a" stroke="#d9a441" stroke-width="12"/>
  <circle cx="512" cy="512" r="452" fill="none" stroke="#d9a441" stroke-width="3" opacity=".7"/>
  <circle cx="512" cy="512" r="378" fill="none" stroke="#d9a441" stroke-width="10"/>

  <text font-family="Liberation Serif, DejaVu Serif, serif" font-weight="700" font-size="60" letter-spacing="5" fill="#f3e7c9">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">LA CIURMA DEGLI ATTEMPATONI</textPath>
  </text>
  <text font-family="Liberation Serif, DejaVu Serif, serif" font-weight="700" font-size="44" letter-spacing="6" fill="#d9a441">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">★  PIRATI DA DIVANO  ★</textPath>
  </text>

  <!-- disco interno: notte sul mare -->
  <g clip-path="url(#inner)">
    <rect width="1024" height="1024" fill="url(#sea)"/>
    <g fill="#f3e7c9" opacity=".8">
      <circle cx="260" cy="330" r="4"/><circle cx="310" cy="250" r="3"/><circle cx="760" cy="300" r="4"/>
      <circle cx="720" cy="230" r="3"/><circle cx="800" cy="420" r="3"/><circle cx="215" cy="440" r="3"/>
      <circle cx="390" cy="190" r="2.5"/><circle cx="650" cy="180" r="2.5"/>
    </g>
    <path d="M140 760 Q 200 725 260 760 T 380 760 T 500 760 T 620 760 T 740 760 T 860 760 T 980 760 V 1024 H 140 Z" fill="#14596a"/>
    <path d="M100 810 Q 170 775 240 810 T 380 810 T 520 810 T 660 810 T 800 810 T 940 810 V 1024 H 100 Z" fill="#0d4150"/>
    <path d="M140 760 Q 200 725 260 760 T 380 760 T 500 760 T 620 760 T 740 760 T 860 760 T 980 760" fill="none" stroke="#bfe3e6" stroke-width="5" opacity=".6"/>
  </g>

  <!-- incrociati dietro il teschio: sciabola e bastone da passeggio -->
  <g stroke="#1a120c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- sciabola -->
    <path d="M 652 708 L 292 300 Q 276 278 300 285 Q 410 362 678 686 Z" fill="#d8dee3"/>
    <path d="M 312 300 Q 420 380 640 660" fill="none" stroke="#9aa6ae" stroke-width="4"/>
    <path d="M 632 722 Q 676 652 724 682 Q 698 716 662 748" fill="#d9a441"/>
    <path d="M 662 728 L 706 780" stroke-width="30" stroke="#1a120c"/>
    <path d="M 662 728 L 706 780" stroke-width="18" stroke="#7a4a23"/>
    <circle cx="712" cy="788" r="15" fill="#d9a441"/>
    <!-- bastone -->
    <path d="M 352 785 L 690 360" stroke-width="34" stroke="#1a120c"/>
    <path d="M 352 785 L 690 360" stroke-width="22" stroke="#8a5a2b"/>
    <path d="M 690 360 C 712 318 780 312 790 360 C 795 385 776 398 758 390" fill="none" stroke-width="34" stroke="#1a120c"/>
    <path d="M 690 360 C 712 318 780 312 790 360 C 795 385 776 398 758 390" fill="none" stroke-width="22" stroke="#8a5a2b"/>
    <circle cx="352" cy="785" r="14" fill="#d9a441"/>
  </g>

  <!-- teschio -->
  <g stroke="#1a120c" stroke-width="8" stroke-linejoin="round">
    <rect x="430" y="520" width="164" height="105" rx="34" fill="#f3e7c9"/>
    <ellipse cx="512" cy="455" rx="152" ry="140" fill="#f3e7c9"/>
    <path d="M 430 560 Q 512 590 594 560 L 594 540 L 430 540 Z" fill="#f3e7c9" stroke="none"/>
    <!-- denti -->
    <path d="M 452 588 H 572 V 612 Q 512 622 452 612 Z" fill="#fffaf0" stroke-width="5"/>
    <path d="M 482 590 V 616 M 512 590 V 619 M 542 590 V 616" stroke-width="5"/>
    <!-- orbite -->
    <ellipse cx="456" cy="468" rx="38" ry="42" fill="#1c1410" stroke="none"/>
    <ellipse cx="568" cy="468" rx="38" ry="42" fill="#1c1410" stroke="none"/>
    <circle cx="466" cy="458" r="7" fill="#f3e7c9" stroke="none"/>
    <circle cx="578" cy="458" r="7" fill="#f3e7c9" stroke="none"/>
    <!-- naso -->
    <path d="M 512 512 L 496 545 Q 512 554 528 545 Z" fill="#1c1410" stroke="none"/>
    <!-- occhiali da lettura -->
    <g fill="#ffffff" fill-opacity=".12" stroke="#d9a441" stroke-width="10">
      <circle cx="456" cy="468" r="54"/>
      <circle cx="568" cy="468" r="54"/>
    </g>
    <path d="M 500 462 Q 512 448 524 462" fill="none" stroke="#d9a441" stroke-width="9"/>
    <path d="M 402 462 L 366 448 M 622 462 L 658 448" stroke="#d9a441" stroke-width="9" stroke-linecap="round"/>
    <!-- baffoni -->
    <path d="M512 560 C 480 540, 432 548, 412 582 C 402 598, 382 594, 376 578 C 380 610, 422 622, 452 602 C 477 588, 500 578, 512 582 C 524 578, 547 588, 572 602 C 602 622, 644 610, 648 578 C 642 594, 622 598, 612 582 C 592 548, 544 540, 512 560 Z" fill="#ffffff" stroke-width="6"/>
  </g>

  <!-- tricorno -->
  <g stroke="#1a120c" stroke-width="8" stroke-linejoin="round">
    <path d="M 330 388 Q 512 318 694 388 Q 690 330 640 312 Q 610 205 512 205 Q 414 205 384 312 Q 334 330 330 388 Z" fill="#231c2b"/>
    <path d="M 340 380 Q 512 316 684 380" fill="none" stroke="#d9a441" stroke-width="10"/>
    <!-- piccolo teschio sul cappello -->
    <g transform="translate(512 282)" stroke-width="3">
      <circle r="24" fill="#f3e7c9"/>
      <rect x="-13" y="14" width="26" height="16" rx="5" fill="#f3e7c9"/>
      <circle cx="-9" cy="0" r="6" fill="#1c1410" stroke="none"/>
      <circle cx="9" cy="0" r="6" fill="#1c1410" stroke="none"/>
    </g>
  </g>
</svg>
