  <!-- cuffie da gamer con microfono -->
  <g stroke="#1a120c" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 366 452 Q 360 262 512 262 Q 664 262 658 452" fill="none" stroke-width="30"/>
    <path d="M 366 452 Q 360 262 512 262 Q 664 262 658 452" fill="none" stroke="#3a3f48" stroke-width="18"/>
    <rect x="330" y="420" width="56" height="104" rx="22" fill="#3a3f48" stroke-width="8"/>
    <rect x="638" y="420" width="56" height="104" rx="22" fill="#3a3f48" stroke-width="8"/>
    <rect x="342" y="440" width="12" height="64" rx="6" fill="#2ec27e" stroke="none"/>
    <rect x="670" y="440" width="12" height="64" rx="6" fill="#2ec27e" stroke="none"/>
    <path d="M 372 510 Q 384 590 456 604" fill="none" stroke-width="16"/>
    <path d="M 372 510 Q 384 590 456 604" fill="none" stroke="#3a3f48" stroke-width="8"/>
    <rect x="450" y="592" width="30" height="22" rx="10" fill="#3a3f48" stroke-width="6"/>
  </g>
</svg>
