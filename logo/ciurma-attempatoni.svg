    <ellipse cx="568" cy="468" rx="38" ry="40" fill="#1c1410" stroke="none"/>
    <path d="M 418 456 Q 456 440 494 456" fill="none" stroke="#f3e7c9" stroke-width="10"/>
    <path d="M 530 456 Q 568 440 606 456" fill="none" stroke="#f3e7c9" stroke-width="10"/>
    <circle cx="462" cy="474" r="7" fill="#f3e7c9" stroke="none"/>
    <circle cx="574" cy="474" r="7" fill="#f3e7c9" stroke="none"/>
    <path d="M 424 520 Q 456 532 488 520 M 536 520 Q 568 532 600 520" fill="none" stroke="#b9a98a" stroke-width="5"/>
    <!-- naso -->
    <path d="M 512 512 L 498 542 Q 512 550 526 542 Z" fill="#1c1410" stroke="none"/>
  </g>

  <!-- bandana -->
  <g stroke="#1a120c" stroke-width="8" stroke-linejoin="round">
    <path d="M 362 432 Q 352 304 512 300 Q 672 304 662 432 Q 512 392 362 432 Z" fill="#b3261e"/>
    <g fill="#f3e7c9" stroke="none">
