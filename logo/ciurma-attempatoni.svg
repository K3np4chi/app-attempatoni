    <path d="M 650 420 Q 700 420 728 470 Q 700 462 676 448 Z" fill="#b3261e"/>
    <path d="M 650 420 Q 708 404 752 430 Q 714 444 672 436 Z" fill="#b3261e"/>
    <circle cx="656" cy="424" r="13" fill="#8f1d17"/>
