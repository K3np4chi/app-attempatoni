name: Aggiorna dati Steam

on:
  schedule:
    - cron: '17 5 * * 1' # ogni lunedì mattina
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run update-steam
      - name: Commit se ci sono novità
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/steam-data.js
          git diff --cached --quiet || git commit -m "Aggiorna dati Steam"
          git push
