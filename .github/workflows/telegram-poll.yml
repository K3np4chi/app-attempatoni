name: Sondaggio Telegram della settimana

on:
  schedule:
    # Domenica alle 18:17 UTC = 20:17 in Italia con l'ora legale, 19:17 con l'ora solare
    - cron: '17 18 * * 0'
  workflow_dispatch: # "Run workflow" per pubblicarlo subito (utile per provare)

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pubblica il sondaggio
        run: node scripts/telegram-poll.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SERATE: ${{ vars.SERATE }}
          ORARIO: ${{ vars.ORARIO }}
          GIOCO: ${{ vars.GIOCO }}
